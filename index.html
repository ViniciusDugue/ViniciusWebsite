<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>vinicius.dugue</title>
<style>
  :root {
    --bg: #0b0d12;
    --text: #e6e9ef;
    --muted: #9aa3b2;
    --dim: #6b7180;
    --accent: #7aa2f7;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 34rem;
    text-align: center;
  }
  .brand {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 1rem;
    letter-spacing: 0.02em;
    color: var(--muted);
  }
  .brand .dot { color: var(--accent); }
  h1 {
    margin: 1.5rem 0 0;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    font-weight: 600;
    line-height: 1.2;
  }
  p {
    margin: 1rem 0 0;
    color: var(--muted);
    line-height: 1.6;
  }
  hr {
    margin: 2.5rem auto 0;
    width: 3rem;
    border: 0;
    border-top: 1px solid var(--border);
  }
  .foot {
    margin-top: 1.5rem;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 0.8rem;
    color: var(--dim);
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="brand">vinicius<span class="dot">.</span>dugue</div>
  <h1>This site is temporarily offline.</h1>
  <p>I have taken it down for a short while. It will be back shortly, at this same address.</p>
  <hr />
  <p class="foot">viniciusdugue.dev</p>
</main>
</body>
</html>
